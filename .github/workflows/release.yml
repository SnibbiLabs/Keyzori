name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer release tag to publish or repair (for example v1.0.0 or v1.0.0-test.1)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  KEYZORI_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  KEYZORI_DATABASE_URL: postgresql://keyzori:keyzori-release-password@127.0.0.1:5432/keyzori
  KEYZORI_REDIS_URL: redis://127.0.0.1:6379
  KEYZORI_ADMIN_API_KEY: release-only-admin-key-that-is-at-least-32-characters

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keyzori
          POSTGRES_USER: keyzori
          POSTGRES_PASSWORD: keyzori-release-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyzori -d keyzori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KEYZORI_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify release source and credentials
        shell: bash
        env:
          KEYZORI_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          KEYZORI_RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          test -n "${KEYZORI_NPM_TOKEN}" || { echo "NPM_TOKEN is not configured." >&2; exit 1; }
          git check-ref-format "refs/tags/${KEYZORI_RELEASE_TAG}" >/dev/null
          tag_commit=$(git rev-list --max-count=1 "refs/tags/${KEYZORI_RELEASE_TAG}")
          test -n "${tag_commit}" || { echo "Release tag ${KEYZORI_RELEASE_TAG} was not found." >&2; exit 1; }
          git merge-base --is-ancestor "${tag_commit}" "origin/${KEYZORI_RELEASE_BRANCH}" || { echo "Release tag must point to the ${KEYZORI_RELEASE_BRANCH} branch." >&2; exit 1; }
          bun run release:verify -- "${KEYZORI_RELEASE_TAG}"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit high-severity dependencies
        run: bun run audit
      - name: Verify workspace
        run: bun run check
      - name: Validate migration history
        run: bun run db:check
      - name: Build distributable artifacts
        run: bun run build
      - name: Verify compiled downstream SDK consumer
        run: bun run test:sdk:compiled
      - name: Smoke-test package artifacts
        run: bun run smoke:packages
      - name: Verify live PostgreSQL and Redis flow
        run: bun run --cwd apps/server ../../tests/liveFlow.ts
        env:
          KEYZORI_LIVE_TEST_ENABLED: "true"
      - name: Validate Compose configuration
        run: |
          docker compose --file dev.docker-compose.yml config --quiet
          docker compose --file prod.docker-compose.yml config --quiet
        env:
          KEYZORI_POSTGRES_PASSWORD: keyzori-release-password
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_sha=$(git rev-parse HEAD)
          version="${KEYZORI_RELEASE_TAG#v}"
          candidate="keyzori-release-candidate:${version}"
          echo "name=${image}" >> "${GITHUB_OUTPUT}"
          echo "candidate=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          docker build \
            --file apps/server/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${commit_sha}" \
            --label "org.opencontainers.image.version=${version}" \
            --tag "${candidate}" \
            --tag "${image}:${KEYZORI_RELEASE_TAG}" \
            .
      - name: Verify release image size reduction
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.image.outputs.candidate }}"
          baseline="ghcr.io/lilsnibbi/keyzori:v0.2.1-test.2"
          docker pull --quiet "${baseline}"
          candidate_size=$(docker image inspect --format '{{.Size}}' "${candidate}")
          baseline_size=$(docker image inspect --format '{{.Size}}' "${baseline}")
          reduction=$(awk -v candidate="${candidate_size}" -v baseline="${baseline_size}" 'BEGIN { printf "%.2f", (1 - candidate / baseline) * 100 }')
          {
            echo "### Release image size"
            echo "- Dual-binary baseline: $(numfmt --to=iec-i --suffix=B "${baseline_size}")"
            echo "- Unified image: $(numfmt --to=iec-i --suffix=B "${candidate_size}")"
            echo "- Reduction: ${reduction}%"
          } | tee --append "${GITHUB_STEP_SUMMARY}"
          if (( candidate_size * 100 > baseline_size * 65 )); then
            echo "Unified image must be at least 35% smaller than the dual-binary baseline." >&2
            exit 1
          fi
      - name: Smoke-test release image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.candidate }}"
          image_user=$(docker image inspect --format '{{.Config.User}}' "${image}")
          case "${image_user}" in
            ""|0|0:*|root|root:*) echo "Image must declare a non-root user." >&2; exit 1 ;;
          esac
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${image}")" = "/app/keyzori"
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "${image}")" = "serve"
          docker run --rm "${image}" admin --help >/dev/null

          run_server() {
            docker run \
              --detach \
              --network host \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --env KEYZORI_DATABASE_URL \
              --env KEYZORI_REDIS_URL \
              --env KEYZORI_ADMIN_API_KEY \
              "${image}"
          }

          wait_until_ready() {
            local container="$1"
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
                return 0
              fi
              if ! docker inspect --format '{{.State.Running}}' "${container}" | grep --quiet true; then
                docker logs "${container}"
                return 1
              fi
              sleep 1
            done
            docker logs "${container}"
            echo "Container did not become ready within 60 seconds." >&2
            return 1
          }

          server=$(run_server)
          trap 'docker rm --force "${server}" >/dev/null 2>&1 || true' EXIT
          wait_until_ready "${server}"
          curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/docs/openapi.json >/dev/null
          if [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" != "404" ]]; then
            docker logs "${server}"
            echo "Unexpected route mounted at /." >&2
            exit 1
          fi
          docker run --rm --network host "${image}" healthcheck
      - name: Push release image tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          version="${{ steps.image.outputs.version }}"
          candidate="${{ steps.image.outputs.candidate }}"
          docker push "${image}:${KEYZORI_RELEASE_TAG}"
          if [[ "${version}" != *-* ]]; then
            docker tag "${candidate}" "${image}:latest"
            docker push "${image}:latest"
          fi
      - name: Publish SDK to npm
        shell: bash
        run: |
          set -euo pipefail
          echo "Authenticated npm user: $(bun pm whoami)"
          version="${KEYZORI_RELEASE_TAG#v}"
          if [[ "${version}" == *-* ]]; then
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
          else
            npm_tag="latest"
          fi
          echo "Publishing ${version} with npm dist-tag ${npm_tag}"
          (cd apps/sdk && bun publish --access public --tolerate-republish --tag "${npm_tag}")
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${KEYZORI_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${KEYZORI_RELEASE_TAG}" \
              --generate-notes \
              --title "${KEYZORI_RELEASE_TAG}" \
              --verify-tag
          fi
