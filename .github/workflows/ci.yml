name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    name: Verify workspace and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keyzori
          POSTGRES_USER: keyzori
          POSTGRES_PASSWORD: keyzori-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyzori -d keyzori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit high-severity dependencies
        run: bun run audit
      - name: Verify workspace
        run: bun run check
      - name: Validate migration history
        run: bun run db:check
      - name: Build distributable artifacts
        run: bun run build
      - name: Verify compiled downstream SDK consumer
        run: bun run test:sdk:compiled
      - name: Smoke-test package artifacts
        run: bun run smoke:packages
      - name: Dry-run SDK package
        run: bun pm pack --cwd apps/sdk --dry-run
      - name: Verify live PostgreSQL and Redis flow
        run: bun run --cwd apps/server ../../tests/liveFlow.ts
        env:
          KEYZORI_LIVE_TEST_ENABLED: "true"
          KEYZORI_DATABASE_URL: postgresql://keyzori:keyzori-ci-password@127.0.0.1:5432/keyzori
          KEYZORI_REDIS_URL: redis://127.0.0.1:6379
          KEYZORI_ADMIN_API_KEY: ci-only-admin-key-that-is-at-least-32-characters
      - name: Validate Compose configuration
        run: |
          docker compose --file dev.docker-compose.yml config --quiet
          docker compose --file prod.docker-compose.yml config --quiet
        env:
          KEYZORI_ADMIN_API_KEY: ci-only-admin-key-that-is-at-least-32-characters
          KEYZORI_POSTGRES_PASSWORD: keyzori-ci-password
      - name: Build server container
        run: bun run docker:build
      - name: Verify image size reduction
        shell: bash
        run: |
          set -euo pipefail
          candidate="keyzori-license-server"
          baseline="ghcr.io/lilsnibbi/keyzori:v0.2.1-test.2"
          docker pull --quiet "${baseline}"
          candidate_size=$(docker image inspect --format '{{.Size}}' "${candidate}")
          baseline_size=$(docker image inspect --format '{{.Size}}' "${baseline}")
          reduction=$(awk -v candidate="${candidate_size}" -v baseline="${baseline_size}" 'BEGIN { printf "%.2f", (1 - candidate / baseline) * 100 }')
          {
            echo "### Server image size"
            echo "- Dual-binary baseline: $(numfmt --to=iec-i --suffix=B "${baseline_size}")"
            echo "- Unified image: $(numfmt --to=iec-i --suffix=B "${candidate_size}")"
            echo "- Reduction: ${reduction}%"
          } | tee --append "${GITHUB_STEP_SUMMARY}"
          if (( candidate_size * 100 > baseline_size * 65 )); then
            echo "Unified image must be at least 35% smaller than the dual-binary baseline." >&2
            exit 1
          fi
      - name: Smoke-test unified container
        shell: bash
        run: |
          set -euo pipefail
          image="keyzori-license-server"
          image_user=$(docker image inspect --format '{{.Config.User}}' "${image}")
          case "${image_user}" in
            ""|0|0:*|root|root:*) echo "Image must declare a non-root user." >&2; exit 1 ;;
          esac
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${image}")" = "/app/keyzori"
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "${image}")" = "serve"
          docker run --rm "${image}" admin --help >/dev/null

          run_server() {
            docker run \
              --detach \
              --network host \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --env KEYZORI_DATABASE_URL=postgresql://keyzori:keyzori-ci-password@127.0.0.1:5432/keyzori \
              --env KEYZORI_REDIS_URL=redis://127.0.0.1:6379 \
              --env KEYZORI_ADMIN_API_KEY=ci-only-admin-key-that-is-at-least-32-characters \
              "${image}"
          }

          wait_until_ready() {
            local container="$1"
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
                return 0
              fi
              if ! docker inspect --format '{{.State.Running}}' "${container}" | grep --quiet true; then
                docker logs "${container}"
                return 1
              fi
              sleep 1
            done
            docker logs "${container}"
            echo "Container did not become ready within 60 seconds." >&2
            return 1
          }

          server=$(run_server)
          trap 'docker rm --force "${server}" >/dev/null 2>&1 || true' EXIT
          wait_until_ready "${server}"
          curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/docs/openapi.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "404"
          docker run --rm --network host "${image}" healthcheck
