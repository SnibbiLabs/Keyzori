x-env-values: &env_values
  KEYZORI_SERVER_HOST: 0.0.0.0
  KEYZORI_SERVER_PORT: 3000
  KEYZORI_DATABASE_URL: postgresql://keyzori:${KEYZORI_POSTGRES_PASSWORD:?Set KEYZORI_POSTGRES_PASSWORD to a URL-safe random value}@postgres:5432/keyzori
  KEYZORI_REDIS_URL: redis://redis:6379
  KEYZORI_ADMIN_API_KEY: ${KEYZORI_ADMIN_API_KEY:?Set KEYZORI_ADMIN_API_KEY to a random value of at least 32 characters}
  KEYZORI_ADMIN_API_KEYS: ${KEYZORI_ADMIN_API_KEYS:-}
  KEYZORI_TRUST_PROXY_HEADERS: ${KEYZORI_TRUST_PROXY_HEADERS:-false}
  KEYZORI_TRUSTED_PROXY_HEADER: ${KEYZORI_TRUSTED_PROXY_HEADER:-x-forwarded-for}
  KEYZORI_TRUSTED_PROXY_CIDRS: ${KEYZORI_TRUSTED_PROXY_CIDRS:-}
  KEYZORI_OPENAPI_ENABLED: ${KEYZORI_OPENAPI_ENABLED:-true}
  KEYZORI_RATE_LIMIT_PER_MINUTE: ${KEYZORI_RATE_LIMIT_PER_MINUTE:-60}
  KEYZORI_LICENSE_RATE_LIMIT_PER_MINUTE: ${KEYZORI_LICENSE_RATE_LIMIT_PER_MINUTE:-30}
  KEYZORI_RATE_LIMIT_PER_IP_PER_MINUTE: ${KEYZORI_RATE_LIMIT_PER_IP_PER_MINUTE:-6000}
  KEYZORI_MAX_REQUEST_BODY_BYTES: ${KEYZORI_MAX_REQUEST_BODY_BYTES:-65536}
  KEYZORI_EVENT_RETENTION_DAYS: ${KEYZORI_EVENT_RETENTION_DAYS:-30}
  KEYZORI_STRIPE_SECRET_KEY: ${KEYZORI_STRIPE_SECRET_KEY:-}
  KEYZORI_STRIPE_WEBHOOK_SECRET: ${KEYZORI_STRIPE_WEBHOOK_SECRET:-}

name: "Keyzori"

services:
  server:
    image: ghcr.io/lilsnibbi/keyzori:latest
    environment:
      <<: *env_values
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: keyzori
      POSTGRES_USER: keyzori
      POSTGRES_PASSWORD: ${KEYZORI_POSTGRES_PASSWORD:?Set KEYZORI_POSTGRES_PASSWORD to a URL-safe random value}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyzori -d keyzori"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
